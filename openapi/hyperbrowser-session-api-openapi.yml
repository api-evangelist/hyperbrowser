          default: 720
    CreateSessionProfile:
      type: object
      properties:
        id:
          type: string
        persistChanges:
          type: boolean
        persistNetworkCache:
          type: boolean
          description: When persisting profile changes, also persist the browser's network cache (HTTP cache).
    UpdateSessionScreenRequest:
      type: object
      required:
      - type
      - params
      properties:
        type:
          type: string
          enum:
          - screen
        params:
          $ref: '#/components/schemas/UpdateSessionScreenParams'
    UpdateSessionScreenParams:
      type: object
      required:
      - width
      - height
      properties:
        width:
          type: integer
          minimum: 500
          maximum: 3840
        height:
          type: integer
          minimum: 360
          maximum: 2160
    UpdateSessionProxyLocationParams:
      type: object
      properties:
        country:
          $ref: '#/components/schemas/ProxyCountry'
        state:
          $ref: '#/components/schemas/ProxyState'
        city:
          type: string
          description: City for managed proxy geolocation.
    Device:
      type: string
      enum:
      - desktop
      - mobile
    UpdateSessionProfileParams:
      type: object
      properties:
        persistChanges:
          type: boolean
          description: Whether profile changes should be persisted after the session ends.
        persistNetworkCache:
          type: boolean
          description: Whether network cache should be persisted into the profile.
    UpdateSessionSolveCaptchasParams:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Whether automatic CAPTCHA solving should be enabled for this running session.
        solverType:
          type: string
          enum:
          - visual
          description: Optional CAPTCHA solver mode. Set to visual to use the visual reCAPTCHA solver.
    ProxyState:
      type:
      - string
      - 'null'
