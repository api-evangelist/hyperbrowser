    BasicResponse:
      type: object
      properties:
        success:
          type: boolean
    GetSessionDownloadsUrlResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/DownloadsStatus'
        downloadsUrl:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
      required:
      - status
    UpdateSessionResponse:
      allOf:
      - $ref: '#/components/schemas/BasicResponse'
      - type: object
        properties:
          solveCaptchas:
            type: boolean
            description: Returned for solveCaptchas updates.
          sessionId:
            type: string
            description: Returned for solveCaptchas updates.
          telemetryReady:
            type: boolean
            description: Returned for solveCaptchas updates.
    CaptchaEvaluationResponse:
      type: object
      properties:
        success:
          type: boolean
        captcha:
          allOf:
          - $ref: '#/components/schemas/CaptchaEvaluationType'
        iterationsRequested:
          type: integer
        iterationsRun:
          type: integer
        solved:
          type: boolean
        solvedCaptchas:
          type: array
          items:
            $ref: '#/components/schemas/CaptchaEvaluationType'
        pages:
          type: array
          items:
            $ref: '#/components/schemas/CaptchaEvaluationPageResult'
