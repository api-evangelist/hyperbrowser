components:
  schemas:
    GeminiComputerUseTaskResponse:
      type: object
      properties:
        jobId:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        data:
          type: object
          properties:
            steps:
              type: array
              items:
                type: object
            finalResult:
              type: string
              nullable: true
        error:
          type: string
          nullable: true
        liveUrl:
          type: string
          nullable: true
      required:
      - jobId
      - status
    StartGeminiComputerUseTaskParams:
      type: object
      properties:
        task:
          type: string
        llm:
          $ref: '#/components/schemas/GeminiComputerUseLlm'
        sessionId:
          type: string
        maxFailures:
          type: number
          default: 3
        maxSteps:
          type: number
          default: 20
        keepBrowserOpen:
          type: boolean
          default: false
        sessionOptions:
          $ref: '#/components/schemas/CreateSessionParams'
        useCustomApiKeys:
