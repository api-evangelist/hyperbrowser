openapi: 3.2.0
info:
  title: Hyperbrowser Extract API
  version: 1.0.0
servers:
- url: https://api.hyperbrowser.ai
  description: Production server
tags:
- name: Extract
paths:
  /api/extract:
    post:
      summary: Start an extract job
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - lang: javascript
        label: Start extract job
        source: "import { Hyperbrowser } from '@hyperbrowser/sdk';\n\nconst client = new Hyperbrowser({ apiKey: 'your-api-key' });\n\nawait client.extract.start({\n  urls: ['https://example.com'],\n  prompt: 'Extract the main headline and author'\n});"
      - lang: python
        label: Start extract job
        source: "from hyperbrowser import Hyperbrowser\nfrom hyperbrowser.models import StartExtractJobParams\n\nclient = Hyperbrowser(api_key='your-api-key')\n\nclient.extract.start(StartExtractJobParams(\n  urls=['https://example.com'],\n  prompt='Extract the main headline and author'\n))"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExtractJobParams'
      responses:
        '200':
          description: Extract job started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartExtractJobResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Extract
      operationId: postApiExtract
      x-operation-id-source: derived
  /api/extract/{id}:
    get:
      summary: Get extract job status and results
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - lang: javascript
        label: Get extract job
        source: 'import { Hyperbrowser } from ''@hyperbrowser/sdk'';


          const client = new Hyperbrowser({ apiKey: ''your-api-key'' });


          await client.extract.get(''job-id'');'
      - lang: python
        label: Get extract job
        source: 'from hyperbrowser import Hyperbrowser


          client = Hyperbrowser(api_key=''your-api-key'')


          client.extract.get(''job-id'')'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Extract job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractJobResponse'
        '404':
          description: Extract job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Extract
      operationId: getApiExtractById
      x-operation-id-source: derived
  /api/extract/{id}/status:
    get:
      summary: Get extract job status
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - lang: javascript
        label: Get extract job status
        source: 'import { Hyperbrowser } from ''@hyperbrowser/sdk'';


          const client = new Hyperbrowser({ apiKey: ''your-api-key'' });


          await client.extract.getStatus(''job-id'');'
      - lang: python
        label: Get extract job status
        source: 'from hyperbrowser import Hyperbrowser


          client = Hyperbrowser(api_key=''your-api-key'')


          client.extract.get_status(''job-id'')'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Extract job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '404':
          description: Extract job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Extract
      operationId: getApiExtractByIdStatus
      x-operation-id-source: derived
