aid: hyperbrowser
name: Hyperbrowser
description: >-
  Hyperbrowser provides cloud browser infrastructure tailored for AI agents,
  bundling managed Chromium sessions with web scraping, crawling, and
  data-extraction APIs. The platform ships an open-source HyperAgent framework
  and first-class integrations for Browser-Use, Claude Computer Use, Gemini
  Computer Use, and OpenAI's CUA, so teams can deploy general-purpose web
  agents quickly. Customers include AI startups, data teams, and enterprises
  needing stealthy, multi-region browsers with CAPTCHA solving, proxies, and
  session profiles. Python and Node SDKs cover sessions, scrape/crawl jobs,
  extraction, and agent task management, with an MCP server for use inside
  Claude, Cursor, and other MCP clients. Pricing is usage-based via the
  hyperbrowser.ai pricing page.
