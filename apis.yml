      stop sessions; retrieve recording, video, and downloads URLs; and run
      manual CAPTCHA evaluation. Sessions expose a WebSocket CDP endpoint and an
      optional live-view URL.
    humanURL: https://docs.hyperbrowser.ai/sessions/overview
