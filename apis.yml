apis:
  - aid: hyperbrowser:browser-api
    name: Hyperbrowser API
    description: >-
      Hyperbrowser's REST API manages cloud browser sessions, profiles,
      extensions, scrape and crawl jobs, structured extraction jobs, and
      agentic task runs across Browser-Use, HyperAgent, Claude Computer Use,
      Gemini Computer Use, and OpenAI CUA. Returns content in HTML, Markdown,
      JSON, and screenshot formats.
    humanURL: https://hyperbrowser.ai/docs
    baseURL: https://api.hyperbrowser.ai
    tags:
