aid: hyperbrowser
name: Hyperbrowser
description: >-
  Hyperbrowser provides cloud browser infrastructure tailored for AI agents,
  bundling managed Chromium sessions with web scraping, crawling, and
  data-extraction APIs. The platform ships the open-source HyperAgent
  framework and first-class integrations for Browser-Use, Claude Computer Use,
  Gemini Computer Use, and OpenAI's CUA, so teams can deploy general-purpose
  web agents quickly. Customers include AI startups, data teams, and
  enterprises that need stealthy, multi-region browsers with CAPTCHA solving,
  proxies, and session profiles. Python and Node SDKs cover sessions,
  scrape/crawl/extract jobs, agent task management, and an MCP server lets
  any Model Context Protocol client (Claude Desktop, Cursor, Windsurf, etc.)
  drive Hyperbrowser tools. Pricing is usage-based via the hyperbrowser.ai
  pricing page.
type: Index
position: Provider
access: 3rd-Party
