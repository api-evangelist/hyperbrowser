naftiko: 1.0.0-alpha2
info:
  label: Hyperbrowser Agents — Cua
  description: Hyperbrowser Agents — Cua. 4 operations. Self-contained Naftiko capability covering one Hyperbrowser business
    surface.
  tags:
  - Hyperbrowser
  - Agents
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    HYPERBROWSER_API_KEY: HYPERBROWSER_API_KEY
capability:
  consumes:
  - type: http
    namespace: agents-cua
    baseUri: https://api.hyperbrowser.ai
    description: Hyperbrowser Agents — Cua business capability. Self-contained, no shared references.
    resources:
    - name: api-task-cua
      path: /api/task/cua
      operations:
      - name: post-api-task-cua
        method: POST
        description: Start a CUA Task
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-task-cua-id
      path: /api/task/cua/{id}
      operations:
      - name: get-api-task-cua-id
        method: GET
        description: Get CUA Task Status and Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Path parameter id
          required: true
    - name: api-task-cua-id-stop
      path: /api/task/cua/{id}/stop
      operations:
      - name: put-api-task-cua-id-stop
        method: PUT
        description: Stop a CUA Task
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Path parameter id
          required: true
    - name: api-task-cua-id-status
      path: /api/task/cua/{id}/status
      operations:
      - name: get-api-task-cua-id-status
        method: GET
        description: Get CUA Task Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Path parameter id
          required: true
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.HYPERBROWSER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: agents-cua-rest
    port: 8080
    description: REST adapter for Hyperbrowser Agents — Cua.
    resources:
    - path: /v1/api/task/cua
      name: api-task-cua
      description: REST surface for api-task-cua.
      operations:
      - method: POST
        name: post-api-task-cua
        description: Start a CUA Task
        call: agents-cua.post-api-task-cua
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/task/cua/{id}
      name: api-task-cua-id
      description: REST surface for api-task-cua-id.
      operations:
      - method: GET
        name: get-api-task-cua-id
        description: Get CUA Task Status and Results
        call: agents-cua.get-api-task-cua-id
        with: {}
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/task/cua/{id}/stop
      name: api-task-cua-id-stop
      description: REST surface for api-task-cua-id-stop.
      operations:
      - method: PUT
        name: put-api-task-cua-id-stop
        description: Stop a CUA Task
        call: agents-cua.put-api-task-cua-id-stop
        with: {}
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/task/cua/{id}/status
      name: api-task-cua-id-status
      description: REST surface for api-task-cua-id-status.
      operations:
      - method: GET
        name: get-api-task-cua-id-status
        description: Get CUA Task Status
        call: agents-cua.get-api-task-cua-id-status
        with: {}
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: agents-cua-mcp
    port: 9090
    transport: http
    description: MCP adapter for Hyperbrowser Agents — Cua.
    tools:
    - name: hyperbrowser-post-api-task-cua
      description: Start a CUA Task
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: agents-cua.post-api-task-cua
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: hyperbrowser-get-api-task-cua-id
      description: Get CUA Task Status and Results
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: agents-cua.get-api-task-cua-id
      with: {}
      outputParameters:
      - type: object
        mapping: $.
    - name: hyperbrowser-put-api-task-cua-id-stop
      description: Stop a CUA Task
      hints:
        readOnly: false
        destructive: true
        idempotent: false
      call: agents-cua.put-api-task-cua-id-stop
      with: {}
      outputParameters:
      - type: object
        mapping: $.
    - name: hyperbrowser-get-api-task-cua-id-status
      description: Get CUA Task Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: agents-cua.get-api-task-cua-id-status
      with: {}
      outputParameters:
      - type: object
        mapping: $.
