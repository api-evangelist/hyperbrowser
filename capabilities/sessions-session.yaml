      operations:
      - name: post-api-session
        method: POST
        description: Create New Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-session-id
      path: /api/session/{id}
      operations:
      - name: get-api-session-id
        method: GET
        description: Get Session by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
